<!doctype html><meta charset="utf-8">
<style>
body{font:13px system-ui;width:260px;margin:12px;color:#222}
label{display:block;margin:10px 0 2px}
input[type=range]{width:100%}
h3{margin:0 0 6px}
@media(prefers-color-scheme:dark){body{background:#202124;color:#eee}}
</style>
<h3>Ambient Glow</h3>
<label><input type="checkbox" id="enabled"> Enabled</label>
<label>Blur <input type="range" id="blur" min="10" max="150" step="1"></label>
<label>Spread <input type="range" id="spread" min="1.05" max="1.8" step="0.05"></label>
<label>Brightness <input type="range" id="brightness" min="0.6" max="2" step="0.05"></label>
<label>Saturation <input type="range" id="saturate" min="0.5" max="3" step="0.1"></label>
<label>Opacity <input type="range" id="opacity" min="0.2" max="1" step="0.05"></label>
<script src="popup.js"></script>
